<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#65a30d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grad2)" opacity="0.1"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#2a2a2a" stroke-width="2" rx="10"/>

  <!-- Header/Nav -->
  <rect x="20" y="20" width="1160" height="70" fill="#1a1a1a" rx="10"/>
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fafafa">MG</text>
  <text x="140" y="65" font-family="Arial, sans-serif" font-size="14" fill="#d4d4d8">Projetos</text>
  <text x="240" y="65" font-family="Arial, sans-serif" font-size="14" fill="#d4d4d8">Experiência</text>
  <text x="380" y="65" font-family="Arial, sans-serif" font-size="14" fill="#d4d4d8">Formação</text>

  <!-- Hero -->
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fafafa">Meus Projetos</text>
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="16" fill="#a1a1a1">Full Stack Developer - Arquitetura & Design</text>

  <!-- Project Cards -->
  <rect x="60" y="220" width="1080" height="200" fill="#1a1a1a" rx="8" stroke="#2a2a2a" stroke-width="1"/>
  <text x="90" y="255" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fafafa">Sinapses - Roadmap Generator</text>
  <text x="90" y="285" font-family="Arial, sans-serif" font-size="14" fill="#d4d4d8">AI-powered learning roadmap platform</text>

  <!-- Tech Badges -->
  <g id="badges">
    <rect x="90" y="305" width="90" height="30" fill="transparent" stroke="#84cc16" stroke-width="1" rx="4"/>
    <text x="135" y="325" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">Astro</text>

    <rect x="200" y="305" width="110" height="30" fill="transparent" stroke="#84cc16" stroke-width="1" rx="4"/>
    <text x="255" y="325" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">TypeScript</text>

    <rect x="330" y="305" width="120" height="30" fill="transparent" stroke="#84cc16" stroke-width="1" rx="4"/>
    <text x="390" y="325" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">Tailwind CSS</text>
  </g>

  <!-- Buttons -->
  <rect x="90" y="360" width="100" height="40" fill="#84cc16" rx="6"/>
  <text x="140" y="385" font-family="Arial, sans-serif" font-size="14" fill="#0a0a0a" text-anchor="middle" font-weight="bold">Visitar</text>

  <rect x="210" y="360" width="100" height="40" fill="transparent" stroke="#84cc16" stroke-width="2" rx="6"/>
  <text x="260" y="385" font-family="Arial, sans-serif" font-size="14" fill="#84cc16" text-anchor="middle" font-weight="bold">Código</text>
</svg>