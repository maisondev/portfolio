<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#65a30d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grad1)" opacity="0.1"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#2a2a2a" stroke-width="2" rx="10"/>

  <!-- Header -->
  <rect x="20" y="20" width="1160" height="80" fill="#1a1a1a" rx="10"/>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#84cc16">Sinapses</text>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="14" fill="#d4d4d8">AI-Powered Roadmap Generator</text>

  <!-- Content -->
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fafafa">Gere roadmaps personalizados com IA</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="16" fill="#a1a1a1">Descreva seu objetivo e a IA cria um plano estruturado</text>

  <!-- Tech Stack -->
  <g id="tech">
    <rect x="60" y="240" width="120" height="40" fill="#1a1a1a" stroke="#84cc16" stroke-width="1" rx="6"/>
    <text x="120" y="265" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">Vue.js</text>

    <rect x="200" y="240" width="120" height="40" fill="#1a1a1a" stroke="#84cc16" stroke-width="1" rx="6"/>
    <text x="260" y="265" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">Node.js</text>

    <rect x="340" y="240" width="120" height="40" fill="#1a1a1a" stroke="#84cc16" stroke-width="1" rx="6"/>
    <text x="400" y="265" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">PostgreSQL</text>

    <rect x="480" y="240" width="150" height="40" fill="#1a1a1a" stroke="#84cc16" stroke-width="1" rx="6"/>
    <text x="555" y="265" font-family="Arial, sans-serif" font-size="12" fill="#84cc16" text-anchor="middle">Google Gemini</text>
  </g>

  <!-- Demo section -->
  <rect x="60" y="320" width="1080" height="240" fill="#1a1a1a" rx="8" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="600" cy="440" r="40" fill="#84cc16" opacity="0.2"/>
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="16" fill="#84cc16" text-anchor="middle" font-weight="bold">Demo Preview</text>
</svg>